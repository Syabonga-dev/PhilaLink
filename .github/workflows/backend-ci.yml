name: Backend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  PHILALINK_TEST_POSTGRES: >-
    Host=127.0.0.1;
    Port=5432;
    Database=postgres;
    Username=postgres;
    Password=philalink_ci_password;
    Pooling=false;
    SSL Mode=Disable

jobs:
  backend-quality:
    name: Build and test backend

    runs-on: ubuntu-latest

    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: philalink_ci_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Show .NET information
        run: dotnet --info

      - name: Restore solution
        run: dotnet restore PersonalProject.slnx

      - name: Build solution
        run: >
          dotnet build
          PersonalProject.slnx
          --configuration Release
          --no-restore

      - name: Run backend and PostgreSQL tests
        run: >
          dotnet test
          Tests/PersonalProject.Tests/PersonalProject.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=backend-tests.trx"
          --results-directory TestResults
          --verbosity normal

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults
          if-no-files-found: ignore
          retention-days: 14
