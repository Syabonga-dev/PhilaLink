name: Backend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

  PHILALINK_TEST_POSTGRES: >-
    Host=127.0.0.1;
    Port=5432;
    Database=postgres;
    Username=postgres;
    Password=philalink_ci_password;
    Pooling=false;
    SSL Mode=Disable

jobs:
  backend-quality:
    name: Build and test backend

    runs-on: ubuntu-latest

    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: philalink_ci_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reject tracked runtime secret files
        shell: bash
        run: |
          tracked_secret_files="$(
            git ls-files |
            grep -E '(^|/)(\.env(\..*)?|appsettings(\.(Development|Production))?\.json)$|\.(pfx|p12|pem|key)$' |
            grep -v 'appsettings\.example\.json' || true
          )"

          if [ -n "$tracked_secret_files" ]; then
            echo "Runtime secret/configuration files must not be committed:"
            echo "$tracked_secret_files"
            exit 1
          fi

          echo "No tracked runtime secret files detected."

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Show .NET information
        run: dotnet --info

      - name: Restore solution with NuGet security audit
        run: >
          dotnet restore
          PersonalProject.slnx
          -p:NuGetAudit=true
          -p:NuGetAuditMode=all
          -p:WarningsAsErrors="NU1903;NU1904"

      - name: Report vulnerable NuGet dependencies
        run: >
          dotnet list
          PersonalProject.slnx
          package
          --vulnerable
          --include-transitive

      - name: Build solution
        run: >
          dotnet build
          PersonalProject.slnx
          --configuration Release
          --no-restore

      - name: Run backend and PostgreSQL tests
        run: >
          dotnet test
          Tests/PersonalProject.Tests/PersonalProject.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=backend-tests.trx"
          --results-directory TestResults
          --verbosity normal

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults
          if-no-files-found: ignore
          retention-days: 14
